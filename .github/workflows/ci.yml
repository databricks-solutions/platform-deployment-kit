name: CI/CD

# GitHub Actions is currently disabled for this repo. ALL test, build, and deploy
# logic lives in scripts/ (scripts/test-all.sh and scripts/deploy.sh). This
# workflow is a THIN wrapper: it only provisions the environment (checkout, Node,
# npm ci) and then calls those scripts. Do not add test/build/deploy logic here —
# keep it in the scripts so local runs and CI stay identical.

on:
  push:

jobs:
  test:
    runs-on:
      group: databricks-solutions-protected-runner-group

    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test pipeline (build + audit + unit + e2e, all with coverage)
        run: ./scripts/test-all.sh --ci --e2e-coverage

  deploy:
    runs-on:
      group: databricks-solutions-protected-runner-group

    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # push the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same gated deploy as `npm run deploy` locally: scripts/deploy.sh runs the
      # full test pipeline (--strict-audit), builds dist/, and publishes it to the
      # gh-pages branch. Nothing reaches the user-facing branch without passing.
      - name: Test, build, and publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh
