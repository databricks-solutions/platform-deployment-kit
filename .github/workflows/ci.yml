name: CI/CD

on:
  push:

jobs:
  test:
    runs-on:
      group: databricks-solutions-protected-runner-group
    env:
      PLAYWRIGHT_SKIP_BUILD: '1'
      
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci

      - name: Build deployable app and fetch upstream Terraform
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run basic tests
        run: npm test -- tests/e2e/basic.spec.js

      - name: Run CIDR calculation tests
        run: npm test -- tests/e2e/cidr-calculations.spec.js

      - name: Run AWS tests
        run: npm test -- tests/e2e/aws.spec.js

      - name: Run Azure tests
        run: npm test -- tests/e2e/azure.spec.js

      - name: Run GCP tests
        run: npm test -- tests/e2e/gcp.spec.js

      - name: Run validation and edge cases tests
        run: npm test -- tests/e2e/validation-edge-cases.spec.js

      - name: Run summary and download tests
        run: npm test -- tests/e2e/summary-download.spec.js

      - name: Run coverage tests
        run: npm test -- tests/e2e/coverage.spec.js

  deploy:
    runs-on:
      group: databricks-solutions-protected-runner-group

    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build deployable app and fetch upstream Terraform
        run: |
          npm ci
          npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
