name: CI/CD

# ALL test, build, and deploy logic lives in scripts/ (scripts/test-all.sh and
# scripts/deploy.sh). This workflow is a THIN wrapper: it only provisions the
# environment (checkout, Node, npm ci) and then calls those scripts. Do not add
# test/build/deploy logic here — keep it in the scripts so local runs and CI stay
# identical.
#
# Hardened per go/hardened-gha for a PUBLIC repo:
#   - GitHub-hosted `ubuntu-latest` runners (public repos cannot use the
#     protected runner group).
#   - Every action pinned to a full commit SHA (tag kept in a comment).
#   - Least-privilege token: `contents: read` by default.
#   - Fork-PR safe: `pull_request` runs get a read-only token and no secrets.
#   - Dependencies installed with `npm ci`, which enforces the integrity hashes
#     in package-lock.json.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test pipeline (build + audit + unit + e2e, all with coverage)
        run: ./scripts/test-all.sh --ci --e2e-coverage

  # PUBLISH IS DISABLED pending the separate go/hardened-gha release review.
  # To re-enable (in a reviewed PR): remove `false &&` from the `if`, set
  # `permissions: contents: write` (needed to push gh-pages), and put the job
  # behind a `release` Environment with a required reviewer and
  # "Prevent self-review" enabled.
  deploy:
    runs-on: ubuntu-latest
    if: ${{ false && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same gated deploy as `npm run deploy` locally: scripts/deploy.sh runs the
      # full test pipeline (--strict-audit), builds dist/, and publishes it to the
      # gh-pages branch. Nothing reaches the user-facing branch without passing.
      - name: Test, build, and publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh
